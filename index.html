<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title></title>
<style>
html,body{margin:0;height:100%;cursor:pointer}
#btn{position:fixed;top:0;left:0;width:100%;height:100%;background:#c00;font-size:70px;color:#fff;display:flex;justify-content:center;align-items:center;text-shadow:0 0 40px #000;box-shadow:inset 0 0 120px #f00}
#ov{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;justify-content:center;align-items:center;z-index:9999;opacity:0;transition:opacity .4s}
#ov video{max-width:98%;max-height:98%;border:15px solid #f00;box-shadow:0 0 120px #f00}
</style>
</head>
<body>

<button id="btn">КЛИК</button>

<div id="ov">
<video autoplay loop>
<source src="video.mp4" type="video/mp4">
</video>
</div>

<audio id="s" loop>
<source src="z.mp3" type="audio/mpeg">
</audio>

<script>
document.body.onclick=function e(){
document.getElementById('ov').style.display='flex';
setTimeout(()=>{document.getElementById('ov').style.opacity='1'},50);
document.getElementById('btn').style.display='none';
let a=document.getElementById('s');
a.volume=1;
a.play();
document.body.onclick=null;
}
</script>
</body>
</html>
